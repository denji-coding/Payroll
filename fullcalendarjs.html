<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FullCalendar Green Theme</title>

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f6fff6;
        }

        #calendar {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header Buttons */
        .fc .fc-button {
            background-color: #2e7d32 !important;
            border-color: #2e7d32 !important;
            color: white !important;
        }

        .fc .fc-button:hover {
            background-color: #256528 !important;
            border-color: #256528 !important;
        }

        .fc .fc-button-active {
            background-color: #1b5e20 !important;
            border-color: #1b5e20 !important;
        }

        /* Today's Date */
        .fc .fc-daygrid-day.fc-day-today {
            background: #e8f5e9 !important;
            border: 1px solid #2e7d32 !important;
        }

        /* Event Color */
        .fc-event {
            background-color: #43a047 !important;
            border-color: #388e3c !important;
            color: white !important;
        }

        /* Hover effect on date cells */
        .fc-daygrid-day-frame:hover {
            background: #f1fff1 !important;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2 style="text-align:center; color:#2e7d32;">FullCalendar – Green Theme</h2>

    <div id="calendar"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var calendarEl = document.getElementById("calendar");

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: "dayGridMonth",
                selectable: true,
                editable: true,
                events: [
                    {
                        title: "Sample Event",
                        start: "2025-01-15"
                    },
                    {
                        title: "Payroll Deadline",
                        start: "2025-01-20"
                    }
                ],
                dateClick: function(info) {
                    alert("You clicked: " + info.dateStr);
                }
            });

            calendar.render();
        });
    </script>

</body>
</html>
