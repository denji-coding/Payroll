<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payroll Modal with Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light p-4">

<!-- Trigger Button -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#calculatePayModal">
  Open Payroll Calculator
</button>

<!-- Payroll Modal -->
<div class="modal fade" id="calculatePayModal" tabindex="-1" aria-labelledby="calculatePayModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content mt-5">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="calculatePayModalLabel">Calculate Payroll</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form id="calculatePayForm" method="post">
          <input type="hidden" id="employeeIdHidden" name="employeeId" />

          <!-- Employee Summary Card -->
          <div class="card mb-4 shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Employee Summary</h6>
              <div class="row">
                <div class="col-md-3">
                  <strong>Full Name:</strong> <span id="summaryFullname">Juan Dela Cruz</span>
                </div>
                <div class="col-md-3">
                  <strong>Present:</strong> <span id="summaryPresent">20</span> days
                </div>
                <div class="col-md-3">
                  <strong>Total Hours:</strong> <span id="summaryTotalHours">160</span> hrs
                </div>
                <div class="col-md-3">
                  <strong>Absent:</strong> <span id="summaryAbsent">2</span> days
                </div>
                <div class="col-md-3 mt-2">
                  <strong>Leave:</strong> <span id="summaryLeave">1</span> day
                </div>
              </div>
            </div>
          </div>

          <!-- Input for work details -->
          <div class="row mb-3">
  <div class="col-sm-4">
    <label for="daysWorked" class="form-label">Total Hours</label>
    <input type="number" class="form-control" id="daysWorked" name="daysWorked" required />
  </div>
  <div class="col-sm-4">
    <label for="hoursPerDay" class="form-label">Absent</label>
    <input
      type="number"
      class="form-control"
      id="hoursPerDay"
      name="hoursPerDay"
      required
    />
  </div>
  <div class="col-sm-4">
    <label for="leaveDays" class="form-label">Leave</label>
    <input type="number" class="form-control" id="leaveDays" name="leaveDays" value="0" required />
  </div>
</div>


         

          <div class="d-flex justify-content-center align-items-center mb-4">
            <button
              type="button"
              class="btn btn-success w-50"
              id="calculatePayBtn"
              name="calculatePayBtn"
              onclick="calculatePayroll()"
            >
              Calculate
            </button>
          </div>

          <!-- Deductions -->
          <div class="row mb-3">
            <div class="col-sm-4">
              <label for="sssDeduct" class="form-label">SSS Deduction</label>
              <input type="text" class="form-control" id="sssDeduct" name="sssDeduct" readonly />
            </div>
            <div class="col-sm-4">
              <label for="pagibigDeduct" class="form-label">Pagibig Deduction</label>
              <input type="text" class="form-control" id="pagibigDeduct" name="pagibigDeduct" readonly />
            </div>
            <div class="col-sm-4">
              <label for="philhealthDeduct" class="form-label">PhilHealth Deduction</label>
              <input type="text" class="form-control" id="philhealthDeduct" name="philhealthDeduct" readonly />
            </div>
          </div>

          <!-- Payroll Output -->
          <div class="row mb-3">
            <div class="col-sm-6">
              <label for="grossPay" class="form-label">Gross Pay</label>
              <input type="text" class="form-control" id="grossPay" name="grossPay" readonly />
            </div>
            <div class="col-sm-6">
              <label for="netPay" class="form-label">Net Pay</label>
              <input type="text" class="form-control" id="netPay" name="netPay" readonly />
            </div>
          </div>

          
        </form>
      </div>

      <div class="modal-footer">
        <button type="submit" class="btn btn-success w-25" id="savePayBtn" form="calculatePayForm">
          Save
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS and Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function calculatePayroll() {
    const days = parseFloat(document.getElementById('daysWorked').value) || 0;
    const hoursPerDay = parseFloat(document.getElementById('hoursPerDay').value) || 0;
    const leaveDays = parseFloat(document.getElementById('leaveDays').value) || 0;
    // You had overtime input referenced but not in your form. I removed overtime from calculation.
    const hourlyRate = parseFloat(document.getElementById('hourlyRate').value) || 0;

    // Calculate total hours as input 'Total Hours' field - since it's user input, we take it as is
    const totalHours = days; // daysWorked is actually total hours in your form label

    // Regular pay based on total hours worked (not days)
    const regularPay = totalHours * hourlyRate;

    // No overtime in current form, so OT pay zero
    const overtimePay = 0;

    const grossPay = regularPay + overtimePay;

    // Sample fixed deductions (replace with real logic)
    const sss = 100;
    const pagibig = 200;
    const philhealth = 150;
    const totalDeductions = sss + pagibig + philhealth;

    const netPay = grossPay - totalDeductions;

    document.getElementById('grossPay').value = grossPay.toFixed(2);
    document.getElementById('netPay').value = netPay.toFixed(2);
    document.getElementById('sssDeduct').value = sss.toFixed(2);
    document.getElementById('pagibigDeduct').value = pagibig.toFixed(2);
    document.getElementById('philhealthDeduct').value = philhealth.toFixed(2);

    // Update summary total hours dynamically
    document.getElementById('summaryTotalHours').textContent = totalHours.toFixed(2);

    // Update summary leave dynamically
    document.getElementById('summaryLeave').textContent = leaveDays.toFixed(0);
  }

  // Example to populate employee data; call this on modal show if you want
  function populateEmployeeData(employee) {
    // If you want to show these fields uncomment below, but your inputs for these are commented out in HTML.
    // document.getElementById('employeeId').value = employee.id;
    // document.getElementById('fullname').value = employee.name;
    // document.getElementById('position').value = employee.position;

    document.getElementById('summaryFullname').textContent = employee.name;
    document.getElementById('summaryPresent').textContent = employee.present;
    const totalHours = employee.totalHours || employee.present * 8; // example fallback
    document.getElementById('summaryTotalHours').textContent = totalHours;

    document.getElementById('summaryAbsent').textContent = employee.absent;
    document.getElementById('summaryLeave').textContent = employee.leave;
  }

  // Example employee data (remove or replace in real usage)
  const exampleEmployee = {
    id: 'EMP001',
    name: 'Juan Dela Cruz',
    position: 'Developer',
    present: 20,
    totalHours: 160,
    absent: 2,
    leave: 1,
  };

  // Auto populate on modal show (optional)
  const payrollModal = document.getElementById('calculatePayModal');
  payrollModal.addEventListener('show.bs.modal', () => {
    populateEmployeeData(exampleEmployee);
  });
</script>

</body>
</html>
